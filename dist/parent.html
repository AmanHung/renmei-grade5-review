<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>家長後台｜小小複習室</title><link rel="stylesheet" href="parent.css?v=2"><link rel="stylesheet" href="learning-visuals.css?v=12"></head><body><div class="layout"><aside><a class="brand" href="index.html">小小複習室</a><span class="eyebrow">PARENT STUDIO</span><h1>陪伴學習，<br>看見每一步。</h1><p>從練習足跡找到需要陪伴的地方。</p><a href="index.html">← 返回孩子的複習桌</a><button id="sources">資料與雲端連線</button><small>紀錄依暱稱分類。相同暱稱會合併顯示。</small></aside><main><header><div><span class="eyebrow">學習觀察室</span><h2>孩子的複習近況</h2></div><button id="refresh">更新雲端紀錄</button></header><p id="status" role="status"></p><section class="filters" aria-label="篩選紀錄"><label>孩子<select id="child"></select></label><label>年級<select id="grade"><option value="">全部年級</option><option value="3">三年級上學期</option><option value="5">五年級上學期</option></select></label><label>科目<select id="subject"><option value="">全部科目</option></select></label><label>期間<select id="period"><option value="0">全部時間</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></label></section><div id="report"></div></main></div><dialog id="source-dialog"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><span class="eyebrow">GOOGLE SHEET CONNECTION</span><h2>自動連線 Google Sheet</h2><p>連線後會直接讀取所有已同步的孩子紀錄，每 60 秒自動更新，不需要匯入資料。</p><form id="connect"><label>家長金鑰<input id="token" type="password" autocomplete="off" required minlength="24" placeholder="首次連線時輸入家長金鑰"></label><label class="remember"><input id="remember" type="checkbox">記住這台私人裝置，以後開啟後台自動連線</label><p class="hint">勾選後，金鑰只保存在這個瀏覽器。可使用此瀏覽器的人也能查看紀錄；共用裝置請勿勾選。</p><button type="submit">連線並啟用自動更新</button></form><button id="disconnect">中斷連線並忘記金鑰</button><p id="connection" role="status"></p><p class="hint"><a href="parent-setup.html" target="_blank" rel="noopener">首次設定或其他裝置的連線說明 ↗</a></p><details><summary>備用方式：匯入舊紀錄 CSV</summary><label class="file">匯入 Google Sheet 的 CSV<input id="import" type="file" accept=".csv,text/csv"></label><p class="hint">僅在離線或需要查看舊備份時使用。匯入資料只在目前分頁暫存。</p></details></dialog><script src="config.js?v=12"></script><script src="content.js?v=12"></script><script src="mock-content.js?v=12"></script><script src="reasoning-visuals.js?v=12"></script><script src="exam-diagrams.js?v=12"></script><script src="exam-b-diagrams.js?v=12"></script><script src="learning-visuals.js?v=12"></script><script src="parent-model.js?v=1"></script><script src="parent.js?v=2"></script></body></html>
