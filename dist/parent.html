<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>家長後台｜小小複習室</title><link rel="stylesheet" href="parent.css?v=1"><link rel="stylesheet" href="learning-visuals.css?v=12"></head><body><div class="layout"><aside><a class="brand" href="index.html">小小複習室</a><span class="eyebrow">PARENT STUDIO</span><h1>陪伴學習，<br>看見每一步。</h1><p>從練習足跡找到需要陪伴的地方。</p><a href="index.html">← 返回孩子的複習桌</a><button id="sources">資料與雲端連線</button><small>紀錄依暱稱分類。相同暱稱會合併顯示。</small></aside><main><header><div><span class="eyebrow">學習觀察室</span><h2>孩子的複習近況</h2></div><button id="refresh">重新整理</button></header><p id="status" role="status"></p><section class="filters" aria-label="篩選紀錄"><label>孩子<select id="child"></select></label><label>年級<select id="grade"><option value="">全部年級</option><option value="3">三年級上學期</option><option value="5">五年級上學期</option></select></label><label>科目<select id="subject"><option value="">全部科目</option></select></label><label>期間<select id="period"><option value="0">全部時間</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></label></section><div id="report"></div></main></div><dialog id="source-dialog"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><span class="eyebrow">DATA CONNECTION</span><h2>選擇紀錄來源</h2><p>本機紀錄會自動讀取。匯入與雲端資料只在目前分頁暫存，關閉後清除。</p><label class="file">匯入 Google Sheet 的 CSV<input id="import" type="file" accept=".csv,text/csv"></label><p class="hint">試算表「作答紀錄」→ 檔案 → 下載 → 逗號分隔值（CSV）。可重複匯入，紀錄編號相同時自動去重。</p><hr><h3>跨裝置讀取雲端紀錄</h3><p class="hint">需先更新 Apps Script，並設定家長金鑰。<a href="parent-setup.html" target="_blank" rel="noopener">查看一次性設定步驟 ↗</a></p><form id="connect"><label>家長金鑰<input id="token" type="password" autocomplete="off" required minlength="24" placeholder="輸入私下保管的家長金鑰"></label><button type="submit">連線並讀取</button></form><button id="disconnect">清除匯入與雲端資料</button><p id="connection" role="status"></p></dialog><script src="config.js?v=12"></script><script src="content.js?v=12"></script><script src="mock-content.js?v=12"></script><script src="reasoning-visuals.js?v=12"></script><script src="exam-diagrams.js?v=12"></script><script src="exam-b-diagrams.js?v=12"></script><script src="learning-visuals.js?v=12"></script><script src="parent-model.js?v=1"></script><script src="parent.js?v=1"></script></body></html>
