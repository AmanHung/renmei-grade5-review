<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>家長後台｜小小複習室</title><link rel="stylesheet" href="parent.css?v=4"><link rel="stylesheet" href="learning-visuals.css?v=12"></head><body><div class="layout"><aside><a class="brand" href="index.html">小小複習室</a><span class="eyebrow">PARENT STUDIO</span><h1>陪伴學習，<br>看見每一步。</h1><p>從練習足跡找到需要陪伴的地方。</p><a href="index.html">← 返回孩子的複習桌</a><button id="sources">資料與雲端連線</button><small>固定顯示悠晴與言旭；測試紀錄預設排除。</small></aside><main><header><div><span class="eyebrow">學習觀察室</span><h2>孩子的複習近況</h2></div><button id="refresh">更新雲端紀錄</button></header><p id="status" role="status"></p><section class="filters" aria-label="篩選紀錄"><label>孩子<select id="child"></select></label><label>年級<select id="grade"><option value="">全部年級</option><option value="3">三年級上學期</option><option value="5">五年級上學期</option></select></label><label>科目<select id="subject"><option value="">全部科目</option></select></label><label>期間<select id="period"><option value="0">全部時間</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></label></section><label class="remember"><input id="include-test" type="checkbox">顯示測試紀錄（預設不載入）</label><div id="report"></div></main></div><dialog id="source-dialog"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><span class="eyebrow">GOOGLE SHEET CONNECTION</span><h2>家長登入</h2><p>連線後會直接讀取所有已同步的孩子紀錄，每 60 秒自動更新，不需要匯入資料。</p><form id="connect"><label>家長密碼<input id="token" type="password" autocomplete="off" required minlength="4" placeholder="輸入共用的家長密碼"></label><label class="remember"><input id="remember" type="checkbox">記住這台私人裝置，以後開啟後台自動連線</label><p class="hint">勾選後，密碼只保存在這個瀏覽器。可使用此瀏覽器的人也能查看紀錄；共用裝置請勿勾選。</p><button type="submit">登入並查看雲端紀錄</button></form><button id="disconnect">中斷連線並忘記密碼</button><p id="connection" role="status"></p><p class="hint"><a href="parent-setup.html" target="_blank" rel="noopener">首次設定或其他裝置的連線說明 ↗</a></p><details><summary>備用方式：匯入舊紀錄 CSV</summary><label class="file">匯入 Google Sheet 的 CSV<input id="import" type="file" accept=".csv,text/csv"></label><p class="hint">僅在離線或需要查看舊備份時使用。匯入資料只在目前分頁暫存。</p></details></dialog><dialog id="unit-wrong-dialog" class="unit-wrong-dialog" aria-labelledby="unit-wrong-title"><form method="dialog"><button class="close" aria-label="關閉單元錯題">×</button></form><h2 id="unit-wrong-title"></h2><p id="unit-wrong-count" class="hint"></p><div id="unit-wrong-content"></div></dialog><script src="config.js?v=12"></script><script src="content.js?v=12"></script><script src="mock-content.js?v=12"></script><script src="mock-c-content.js?v=18.0.0"></script><script>window.REVIEW_EXAM_ITEMS.push(...window.REVIEW_C_ITEMS);</script><script src="reasoning-visuals.js?v=12"></script><script src="exam-diagrams.js?v=12"></script><script src="exam-b-diagrams.js?v=12"></script><script src="learning-visuals.js?v=12"></script><script src="parent-model.js?v=5"></script><script src="parent.js?v=8"></script></body></html>
