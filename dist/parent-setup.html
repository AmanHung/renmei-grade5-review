<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長後台使用說明</title><link rel="stylesheet" href="parent.css"></head><body><main style="max-width:850px;margin:auto"><a href="parent.html">← 家長後台</a><h1>任何裝置皆可查看孩子紀錄</h1><section class="panel"><ol><li>在手機、平板或電腦開啟家長後台，不需輸入密碼。</li><li>選擇孩子，查看單元進度、成績與錯題；雲端每 60 秒自動更新，也可按「更新雲端紀錄」。</li><li>孩子端可先依目前裝置已保存的進度做題，同步在背景進行，暫時離線也能繼續作答。</li></ol><p>孩子尚未同步的作答不會出現在另一台裝置。若要換裝置接續同一份草稿，請先讓原裝置完成同步。背景更新不會覆蓋正在作答的考卷。</p><p>管理者：將最新 gas/Code.gs 更新至原 Apps Script 專案，並在管理部署中選擇新版本更新原部署。原試算表與同步網址繼續使用，新版不再使用舊密碼屬性。</p></section></main></body></html>
